[project]
name = "urbanflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hungnguyencode", email = "van21727@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydeck>=0.9.3",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
urbanflow = "urbanflow:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
